name: Check stock

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run check
        env:
          PART_NUMBER: ${{ vars.PART_NUMBER || 'MK2E4ZA/A' }}
          LOCATION: ${{ vars.LOCATION }}
        run: python check.py

      - name: Commit status.json if changed
        run: |
          git add -N status.json 2>/dev/null || true
          if git diff --quiet -- status.json; then
            echo "status.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Update stock status"
          git push
